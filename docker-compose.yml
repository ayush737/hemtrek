services:
  hemtrek:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hemtrek
    restart: unless-stopped
    ports:
      - "8092:4173"
    environment:
      NODE_ENV: production
      PORT: 4173
      ADMIN_EMAIL: admin@himroutes.in
      ADMIN_PASSWORD: Admin@123456
    volumes:
      - hemtrek_data:/app/data

volumes:
  hemtrek_data:
